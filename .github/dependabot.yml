version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/packages/cli"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/egress-proxy"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/github-action"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/install"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-audit"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/mcp-runtime"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/sdk"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/examples/enforcement-demo"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/examples/node-demo"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/examples/site-guard-express"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/examples/site-guard-nextjs"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/examples/webhook-receiver"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
